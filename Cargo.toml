[package]
name = "gh-trellis"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A LazyGit-style terminal UI for GitHub stacked pull requests (gh stack)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jordanleeevans/gh-trellis"
readme = "README.md"
keywords = ["git", "github", "stacked-prs", "tui", "gh-extension"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/tapes/", ".github/"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-std", "full"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3.27.0"
