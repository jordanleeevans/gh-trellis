# Configuration for git-cliff
# Reference: https://github.com/orhun/git-cliff

[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """

{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
    - {% if commit.breaking %}[BREAKING]{% endif %}\
        {% if commit.scope %}({{ commit.scope }}) {% endif %}\
        {{ commit.message | split(pat="\n") | first | trim | upper_first }}{% if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}){% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
    {%- endfor %}
{% endfor %}\n
"""

# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""

# remove the leading and trailing whitespace from the templates
trim = true

# changelog settings
[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true

# filter out the commits that are not conventional
filter_unconventional = false

# process each line of a commit as an individual commit
split_commits = false

# regex for preprocessing the commit messages
commit_preprocessors = [
    # Turn issue refs like "(#15)" into links to the GitHub issue
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/jordanleeevans/gh-trellis/issues/${2}))" },
]

# regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
    # Squash merge and regular merge commits should be skipped
    { message = "^Squash merge", skip = true },
    { message = "^Merge", skip = true },
    # Capture other commits under "Other" to avoid losing information
    { message = "^Add", group = "Features" },
]

# protect breaking changes from being skipped due to conventional commit filter
protect_breaking_commits = false

# filter commits by commit scope
filter_commits = false

# regex for matching git tags
tag_pattern = "v[0-9].*"

# regex for skipping tags
skip_tags = ""

# sort the tags topologically
topo_order = false

# sort the commits inside sections by oldest first
sort_commits = "oldest"

# limit the number of commits included in the changelog.
# limit_commits = 42
